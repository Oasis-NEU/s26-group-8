# CI for every push and PR. Mirrors what the real deploys gate:
#   frontend  -> tsc + vite build (what fails a Vercel deploy)
#   backend   -> pip install + pytest (deps + "does server.py import")
#   secrets   -> gitleaks over full history + tracked-.env guard
# Lint is non-blocking until the existing ESLint errors are cleaned up.
# No repository secrets are used anywhere in this workflow.
name: CI

# Read-only token: no job writes, and this caps what a compromised
# third-party action could do with GITHUB_TOKEN on this public repo.
permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dead address: the prebuild sitemap script degrades to the static
      # sitemap instead of hitting the live prod API on every push.
      - run: npm run build
        env:
          SITEMAP_API_URL: http://127.0.0.1:9

  lint:
    name: Frontend lint (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Soft check: failures annotate the run but stay green until the
      # pre-existing ESLint errors are fixed, then drop this flag.
      - run: npm run lint
        continue-on-error: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      # Better_Scraper/tests covers the RMP scraper's integrity guards (partial
      # search, review-fetch failures, the pre-write sanity check). It was not
      # collected by `pytest tests`, so those tests had never gated a push.
      # Separate invocation: both directories are packages named `tests`, so
      # collecting them together fails on the duplicate module name.
      - run: python -m pytest Better_Scraper/tests -q

  scraper:
    name: Scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt pytest
      # Covers the Banner pipeline's transport, sanity gates, loader and
      # matcher. Its own job rather than a step on `backend`: these tests run
      # from `scraper/` (the modules import each other as top-level names) and
      # need a different dependency set. Like Better_Scraper/tests above, this
      # suite existed but gated nothing until it was wired in here.
      - run: python -m pytest tests -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact .
      - name: no tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$'; then
            echo "::error::Tracked .env-style file found. Remove it from git and rotate anything inside it."
            exit 1
          fi
          echo "No tracked .env files."
