# CI for every push and PR. Mirrors what the real deploys gate:
#   frontend  -> tsc + vite build (what fails a Vercel deploy)
#   backend   -> pip install + pytest (deps + "does server.py import")
#   secrets   -> gitleaks over full history + tracked-.env guard
# Lint is non-blocking until the existing ESLint errors are cleaned up.
# No repository secrets are used anywhere in this workflow.
name: CI

# Read-only token: no job writes, and this caps what a compromised
# third-party action could do with GITHUB_TOKEN on this public repo.
permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dead address: the prebuild sitemap script degrades to the static
      # sitemap instead of hitting the live prod API on every push.
      - run: npm run build
        env:
          SITEMAP_API_URL: http://127.0.0.1:9
      # The displayed rating blend exists three times: vectorised in
      # precompute.calibrate_rmp, scalar in rating_scale.project_rmp, and in
      # TypeScript in utils/ratingBlend.ts. pytest pins the first two to each
      # other; nothing ran the third. test_rating_blend recomputes the constants
      # this asserts, but it compares them against literals in the Python file
      # and never reads or executes the .ts — so editing the arithmetic in the
      # module the browser actually runs kept the whole suite green. Blocking,
      # not soft: it is pure arithmetic with no environment to be flaky about.
      - run: npm run selftest

  lint:
    name: Frontend lint (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Soft check: failures annotate the run but stay green until the
      # pre-existing ESLint errors are fixed, then drop this flag.
      - run: npm run lint
        continue-on-error: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact .
      - name: no tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$'; then
            echo "::error::Tracked .env-style file found. Remove it from git and rotate anything inside it."
            exit 1
          fi
          echo "No tracked .env files."
