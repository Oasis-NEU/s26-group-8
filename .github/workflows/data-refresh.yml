name: Data Refresh

on:
  schedule:
    - cron: "0 10 * * 0"  # 10:00 UTC every Sunday
  workflow_dispatch:

# Only one refresh at a time. A manual dispatch overlapping the Sunday cron
# would give two runs force-pushing the same orphan branch over the data store,
# and two precomputes dropping and rebuilding professors_catalog underneath each
# other. Queue rather than cancel: a cancelled run can stop between the DB write
# and the store push, leaving the two out of step.
concurrency:
  group: data-refresh
  cancel-in-progress: false

# Nothing here reads or writes the repo through GITHUB_TOKEN — the data store is
# pushed with RMH_DATA_TOKEN — so drop the default write scopes.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The scrape is ~3.9k professors over 10 threads plus a full precompute.
    # Without a cap a hung request rides the 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Pull the CSV data store (TRACE data, photos, previous RMP data) into
      # output_data. precompute.py reads all six CSVs from here; the RMP scrape
      # below overwrites rmp_professors.csv / rmp_reviews.csv with fresh data.
      - name: Fetch data store
        env:
          RMH_DATA_TOKEN: ${{ secrets.RMH_DATA_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${RMH_DATA_TOKEN}@github.com/RayanR000/RateMyHusky-data.git" \
            backend/Better_Scraper/output_data

      # Record what the store held BEFORE the scrape overwrites it, so the
      # sanity check below can compare against real numbers instead of a static
      # floor. Written to the runner temp, not into output_data — that
      # directory is the data-store working tree and gets `git add -A`'d.
      - name: Record pre-scrape baseline
        working-directory: backend
        run: |
          python Better_Scraper/scrape_guard.py baseline \
            --data-dir Better_Scraper/output_data \
            --out "${{ runner.temp }}/rmp_baseline.json"

      - name: RMP scrape
        working-directory: backend
        run: |
          python Better_Scraper/fetch_lite.py \
            -s 696 \
            --file_path Better_Scraper/output_data/rmp_professors.csv

      # Guardrail: a broken/rate-limited scrape returns near-empty results.
      # Abort before touching the DB or the data store so good data survives.
      # See scrape_guard.py for what it checks and why the floors are relative
      # to the previous snapshot rather than fixed.
      - name: Sanity check scrape
        working-directory: backend
        run: |
          python Better_Scraper/scrape_guard.py check \
            --data-dir Better_Scraper/output_data \
            --baseline "${{ runner.temp }}/rmp_baseline.json"

      # Upsert the freshly scraped RMP rows into the raw DB tables so new
      # review text / new professors reach the site. Idempotent either way:
      # reviews are append-only, so rows already present are skipped and the
      # write is just the delta; professor summary rows are re-sent in full and
      # overwritten, because a re-scrape is supposed to move their numbers.
      - name: Load fresh RMP rows into CockroachDB
        working-directory: backend
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
        run: python migrate_to_crdb.py rmp_professors rmp_reviews

      # The other half of that upsert: migrate_to_crdb only inserts, so reviews
      # deleted on RMP stay in the table and keep being rendered even though the
      # count beside them (counted from the CSV by precompute) has already
      # dropped. Runs after the load so the fresh rows are in, and before
      # precompute so the list and the count describe the same set.
      - name: Prune reviews RMP no longer serves
        working-directory: backend
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
        run: python prune_rmp_reviews.py

      # RMP-only refresh: TRACE data is unchanged this run, so skip the heavy
      # TRACE table maintenance (REFRESH_TRACE=false). Run a full precompute
      # (REFRESH_TRACE unset/true) after a manual TRACE re-scrape.
      - name: Precompute & write to CockroachDB
        working-directory: backend
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
          REFRESH_TRACE: "false"
        run: python precompute.py

      # Commit the refreshed CSVs back as a single squashed commit (orphan
      # branch) so the data store stays a flat snapshot rather than growing
      # history on every weekly run.
      - name: Push refreshed data back to store
        working-directory: backend/Better_Scraper/output_data
        env:
          RMH_DATA_TOKEN: ${{ secrets.RMH_DATA_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan refreshed
          git add -A
          git commit -q -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git branch -D main
          git branch -m main
          git push -f \
            "https://x-access-token:${RMH_DATA_TOKEN}@github.com/RayanR000/RateMyHusky-data.git" \
            main
